# agentlabs-voice key bindings. Sourced by install.sh into ~/.tmux.conf.
# All are prefix keys: press your tmux prefix first (Ctrl-b by default).

# --- speech out ---
bind-key v run-shell -b 'cd "#{pane_current_path}" && ~/.claude/hooks/say-last.sh --pane "#{pane_id}"'
bind-key V run-shell -b '~/.claude/hooks/hush.sh'
# Drop the utterance being spoken and move to the next one queued. V stops
# everything; this only skips one.
bind-key > run-shell -b '~/.claude/hooks/skip.sh'
# Where is this session right now? Answered from the transcript, so it works
# while the agent is blocked in a long tool call -- which is when you ask.
bind-key u run-shell -b "~/.local/bin/voice-status '#{pane_id}'"
# Auto-speak on/off for THIS session: speak replies without asking, or keep
# offering the pane. Only ever speaks while this window is the one on screen.
bind-key A run-shell -b "~/.local/bin/voice-auto '#{pane_id}'"
# Pick this session's voice; the choice sticks to the session, not the machine.
bind-key y run-shell -b "~/.local/bin/voice-popup '#{pane_id}'"

bind-key p run-shell -b '~/.claude/hooks/resume-speech.sh --pane "#{pane_id}"'
# --- speech in: online, with live text ---
# Space is the primary dictation key; n is kept as an alias. tmux's default
# Space (next-layout) moves to C-Space.
bind-key Space run-shell -b '~/.claude/hooks/dictate-live.sh --pane "#{pane_id}"'
bind-key C-Space next-layout
bind-key n run-shell -b '~/.claude/hooks/dictate-live.sh --pane "#{pane_id}"'
bind-key N run-shell -b '~/.claude/hooks/dictate-live.sh --pane "#{pane_id}" --enter'

# --- speech in: offline, local whisper ---
bind-key m run-shell -b '~/.claude/hooks/dictate.sh --pane "#{pane_id}"'
bind-key e run-shell -b '~/.claude/hooks/dictate.sh --pane "#{pane_id}" --enter'
